plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.95'
    id("me.modmuss50.mod-publish-plugin") version "1.1.0"
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = mod_id
    version = getFullModVersion()
}

java {
    withSourcesJar()

    toolchain.languageVersion.set(JavaLanguageVersion.of(21))
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    implementation "maven.modrinth:epic-fight:${project.epicfight_version}"
    // Change "compileOnly" to "implementation" for testing in-game.
    compileOnly("dev.isxander:controlify:${project.controlify_version}") {
        // Only need Controlify API, ignore the transitive dependencies (e.g, QuiltMC parsers)
        transitive = false
    }
}

repositories {
    maven { url = "https://cursemaven.com" }
    mavenLocal()
    exclusiveContent {
        forRepository { maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
    exclusiveContent {
        forRepository { maven { url "https://maven.isxander.dev/releases" } }
        filter { includeGroup "dev.isxander" }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

def getFullModVersion() {
    return "${mod_version}-mc${minecraft_version}-neoforge"
}

publishMods {
    def releaseNotesFile = project.file("RELEASE_NOTES.md")
    def releaseNotesContent = releaseNotesFile.text

    changelog = """
|**Tested against:**
|- **NeoForge:** ${neo_version}
|- **Minecraft:** ${minecraft_version}
|- **Epic Fight:** ${epicfight_version}
|
|${releaseNotesContent}
""".stripMargin().trim()

    modLoaders.add("neoforge")
    type = STABLE
    displayName = getFullModVersion()
    file = tasks.jar.archiveFile
    additionalFiles.from(sourcesJar)

    curseforge {
        accessToken = System.getenv("CURSEFORGE_TOKEN")
        projectId = "1184379"
        minecraftVersions.add(minecraft_version)
        projectSlug = "epic-fight-invincible"
    }

    modrinth {
        accessToken = System.getenv("MODRINTH_TOKEN")
        projectId = "cdaWrTra"
        minecraftVersions.add(minecraft_version)

        // Syncs the GitHub README with the Modrinth project description
        // projectDescription = file("README.md").text
    }
}
